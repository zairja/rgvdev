<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FullCalendar Example</title>
  
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 40px 10px;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div id="calendar"></div>

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {	
        initialView: 'timeGridDay',
		headerToolbar: { center: 'dayGridMonth,timeGridWeek,timeGridDay' },
        events: [
          { title: 'Lowe\'s', start: '2025-04-25T16:56:09+0000', end: '2025-04-25T22:56:09+0000', editable: true, backgroundColor: 'green' },
          { title: 'Walmart', start: '2025-04-25T16:56:09+0000', end: '2025-04-25T22:56:09+0000', editable: true, backgroundColor: 'blue' },
		  { title: 'Nine Tails', start: '2025-04-25T16:56:09+0000', end: '2025-04-25T22:56:09+0000', editable: true, backgroundColor: 'orange' }
        ]
      });

      calendar.render();
    });
  </script>
</body>
</html>
